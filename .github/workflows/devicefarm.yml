name: devicefarm

# Thin caller. All logic lives in dannyheskett/.github.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to device-test"
        type: choice
        options: [both, android, ios]
        default: both
      max_devices:
        description: "Number of real devices to fuzz-test on (per platform)"
        default: "1"
      simstats:
        description: "High-refresh sim-rate check (Android only)"
        type: boolean
        default: false
      device_model:
        description: "Device MODEL filter, e.g. 'Galaxy S23'"
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  devicefarm:
    uses: dannyheskett/.github/.github/workflows/game-devicefarm.yml@v2
    with:
      platform: ${{ inputs.platform }}
      max_devices: ${{ inputs.max_devices }}
      simstats: ${{ inputs.simstats }}
      device_model: ${{ inputs.device_model }}
    secrets: inherit
